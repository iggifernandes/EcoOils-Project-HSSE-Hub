<!-- ==========================================================================
  EcoOils HSSE — STANDARD VERSION (every app, same place)
  Location : TOP RIGHT of the page, directly ABOVE the EN/ID language toggle
  Format   : "v1.0 · 2026-10-21"
  To update: change ONLY the two values below (and the same version on the hub card).
  Rule     : small change (fix, wording, new field)  -> 1.0 -> 1.1
             big change (new module, redesign)       -> 1.1 -> 2.0
=========================================================================== -->
<style>
  .eco-rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .eco-ver{font:12px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;color:#6b7f72}
</style>
<!-- Wrap your existing language toggle like this: -->
<div class="eco-rt"><div class="eco-ver" id="ecoVer" title="Version"></div><!-- your EN/ID toggle here --></div>
<script>
  /* ---- EDIT THESE TWO ---- */
  var APP_VERSION = "1.0", APP_DATE = "2026-10-21";
  /* ------------------------ */
  document.getElementById("ecoVer").textContent = "v" + APP_VERSION + " · " + APP_DATE;
</script>
