<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EcoOils HSSE Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== BRAND TOKENS: change the green here and the whole hub follows ===== */
  :root{
    --green-900:#0b3a22;
    --green-800:#115231;
    --green-700:#176b41;
    --green-500:#2f9a62;
    --green-100:#e3f1e8;
    --green-50:#f1f8f3;
    --sun:#f2b84b;
    --ink:#10261a;
    --muted:#4f6657;
    --line:#d3e3d9;
    --paper:#fbfdfb;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  /* ===== Top bar + logo ===== */
  .bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px clamp(16px,4vw,48px);color:#fff}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{background:#fff;border-radius:12px;padding:6px 12px;display:grid;place-items:center}
  .brand .logo img{height:30px;width:auto;display:block}
  .brand .hubname{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
  .lang{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
  .lang button{background:transparent;border:0;color:#fff;font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--green-800)}

  /* ===== Hero ===== */
  .hero{position:relative;background:linear-gradient(180deg,#0b3a22 0%,#115231 55%,#1c7447 100%);color:#fff;padding:68px clamp(16px,4vw,48px) 0;overflow:hidden}
  .hero-inner{max-width:1120px;margin:0 auto;position:relative;z-index:2;padding-bottom:66px}
  .hero h1{font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.08;max-width:24ch}
  .hero p{max-width:60ch;margin:8px 0 0;color:#d6ecde;font-size:.92rem}
  .sun{position:absolute;right:12%;bottom:34px;width:clamp(70px,10vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ffd98a 0%,#f2b84b 55%,rgba(242,184,75,0) 72%);opacity:.95;z-index:1}
  .skyline{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:56px;z-index:3;display:block}

  /* ===== Tabs + search ===== */
  .toolbar{max-width:1120px;margin:-24px auto 0;padding:0 clamp(16px,4vw,48px);position:relative;z-index:6}
  .toolbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 6px 18px rgba(11,58,34,.12)}
  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:0;background:transparent;font:inherit;font-size:.84rem;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab:hover{background:var(--green-50);color:var(--green-800)}
  .tab[aria-selected="true"]{background:var(--green-800);color:#fff}
  .tab .n{opacity:.7;font-weight:500;margin-left:5px;font-size:.78rem}
  .search{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;flex:none}
  .search svg{width:16px;height:16px;flex:none;color:var(--muted)}
  .search input{border:0;outline:0;font:inherit;font-size:.86rem;width:150px;background:transparent;color:var(--ink)}

  /* ===== Panel ===== */
  main{max-width:1120px;margin:0 auto;padding:18px clamp(16px,4vw,48px) 36px}
  .note{color:var(--muted);font-size:.82rem;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

  /* ===== App card ===== */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--green-500);box-shadow:0 8px 24px rgba(23,107,65,.12)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start}
  .icon{width:38px;height:38px;border-radius:10px;background:var(--green-100);color:var(--green-800);display:grid;place-items:center}
  .icon svg{width:21px;height:21px}
  .tag{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid}
  .tag.team{color:var(--green-800);border-color:var(--green-700);background:var(--green-50)}
  .tag.open{color:#7a4b00;border-color:var(--sun);background:#fff6df}
  .tag.soon{color:var(--muted);border-color:var(--line);background:#f4f7f5}
  .card h3{font-size:.98rem;line-height:1.2}
  .card p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.4;flex:1}
  .btn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.8rem;color:#fff;background:var(--green-700);padding:5px 11px;margin-top:2px;border-radius:999px;transition:background .15s}
  .btn:hover{background:var(--green-900)}
  .btn svg{width:14px;height:14px}
  .actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
  .actions .btn{margin-top:0}
  .btn.alt{background:#fff;color:var(--green-800);border:1px solid var(--green-700)}
  .btn.alt:hover{background:var(--green-50)}
  .btn.alt svg{width:15px;height:15px}
  .btn[aria-disabled="true"]{background:#e8eeea;color:#7b8d82;pointer-events:none}

  .dash{margin-top:18px;border:1.5px dashed var(--green-500);border-radius:var(--radius);padding:12px 14px;background:var(--green-50);display:flex;gap:12px;align-items:center}
  .dash .icon{background:#fff}
  .dash h3{font-size:.95rem;color:var(--green-800)}
  .dash p{margin:0;color:var(--muted);font-size:.8rem}
  .empty{color:var(--muted);padding:24px 0}

  footer{border-top:1px solid var(--line);padding:12px clamp(16px,4vw,48px);text-align:center;color:var(--muted);font-size:.78rem}

  @media (max-width:720px){
    .toolbar-in{flex-direction:column;align-items:stretch;border-radius:18px;gap:4px}
    .search{padding:4px 10px}
    .search input{width:100%}
  }
  @media (prefers-reduced-motion:no-preference){
    .sun{animation:rise 1.6s ease-out both}
    @keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:.95}}
  }
</style>
</head>

    </label>
  </div>
</div>

<main id="main" role="tabpanel"></main>

<footer data-i18n="footer">EcoOils HSSE Hub. Team tools are for the HSSE team only. Do not share their links.</footer>

<script>
/* =====================================================================
   1) YOUR TOOLS. To add one, copy a block and change it.
      cat:    training | health | records | dev   (which tab it sits in)
      access: "open" = share freely, "team" = HSSE team only
      url:    leave "" and the card shows "Coming soon"
      sheet:  paste the Google Sheet link here and a small Sheet button appears on the card
      drive:  paste the Google Drive folder link here and a small Drive button appears
      Order matters: live tools first, builds in progress last.
   ===================================================================== */
const B = "https://iggifernandes.github.io/";
const APPS = [
  { id:"induction", cat:"training", access:"open", icon:"shield", sheet:"", drive:"",
    url:B+"EcoOils-Project-Site-Induction-Sei-Mangkei/",
    en:{name:"Site Induction",         desc:"Induction and final assessment for everyone entering site."},
    id:{name:"Induksi Tapak",          desc:"Induksi dan penilaian akhir untuk semua yang masuk ke lokasi."} },
  { id:"tracker",   cat:"records",  access:"team", icon:"track", sheet:"", drive:"",
    url:B+"EcoOils-Project-HSSE-tracker/",
    en:{name:"HSSE Tracker",           desc:"Track HSSE items and actions across the project."},
    id:{name:"Pelacak HSSE",           desc:"Lacak item dan tindakan HSSE di seluruh proyek."} },
  { id:"ims",       cat:"records",  access:"team", icon:"ims", sheet:"", drive:"",
    url:B+"EcoOils-Project-IMS/",
    en:{name:"IMS",                    desc:"Project IMS, including incident records, trends and learning."},
    id:{name:"IMS",                    desc:"IMS proyek, termasuk catatan insiden, tren, dan pembelajaran."} },
  { id:"health",    cat:"health",   access:"team", icon:"heart", sheet:"", drive:"",
    url:B+"EcoOils-Project-Health-Monitoring/",
    en:{name:"Health Monitoring",      desc:"Health record tools for the crew, all from one page."},
    id:{name:"Pemantauan Kesehatan",   desc:"Alat catatan kesehatan kru dalam satu halaman."} },
  { id:"bp",        cat:"health",   access:"team", icon:"pulse", sheet:"", drive:"",
    url:B+"EcoOils-Project-blood-pressure-monitoring/",
    en:{name:"Blood Pressure Monitoring", desc:"Blood pressure readings and follow-up for the crew."},
    id:{name:"Pemantauan Tekanan Darah",  desc:"Hasil tekanan darah dan tindak lanjut untuk kru."} },
  { id:"alcohol",   cat:"health",   access:"team", icon:"drop", sheet:"", drive:"",
    url:B+"EcoOils-Project-drug---alcohol-test-record/",
    en:{name:"Drug & Alcohol Test Record", desc:"Daily drug and alcohol test entries for the crew."},
    id:{name:"Catatan Tes Narkoba & Alkohol", desc:"Entri tes narkoba dan alkohol harian untuk kru."} },
  { id:"database",  cat:"records",  access:"team", icon:"db", sheet:"", drive:"",
    url:B+"EcoOils-project-hsse-database/",
    en:{name:"HSSE Database",          desc:"Register of safety officers and managers, with profiles and CVs."},
    id:{name:"Database HSSE",          desc:"Daftar petugas dan manajer keselamatan, lengkap dengan profil dan CV."} },

  { id:"training",  cat:"training", access:"open", icon:"book", sheet:"", drive:"", url:"",
    en:{name:"Training Hub",           desc:"Training modules for contractors and crews."},
    id:{name:"Pusat Pelatihan",        desc:"Modul pelatihan untuk kontraktor dan kru."} },

  { id:"ptw",       cat:"dev", access:"team", icon:"permit", sheet:"", drive:"", url:"",
    en:{name:"PTW Registry",           desc:"Track every Permit to Work and revalidation by contractor."},
    id:{name:"Register PTW",           desc:"Lacak setiap Izin Kerja dan revalidasi per kontraktor."} },
  { id:"ptwtrain",  cat:"dev", access:"open", icon:"book", sheet:"", drive:"", url:"",
    en:{name:"PTW Training",           desc:"Permit to Work training package, like the induction."},
    id:{name:"Pelatihan PTW",          desc:"Paket pelatihan Izin Kerja, seperti induksi."} },
  { id:"uauc",      cat:"dev", access:"team", icon:"chart", sheet:"", drive:"", url:"",
    en:{name:"UAUC Intelligence",      desc:"Unsafe act and unsafe condition trends with POB tracking."},
    id:{name:"Intelijen UAUC",         desc:"Tren tindakan dan kondisi tidak aman dengan pelacakan POB."} },
  { id:"recognition", cat:"dev", access:"team", icon:"medal", sheet:"", drive:"", url:"",
    en:{name:"Crew Recognition",       desc:"Great Job nominations and appreciation certificates."},
    id:{name:"Penghargaan Kru",        desc:"Nominasi Great Job dan sertifikat apresiasi."} },
  { id:"bulletin",  cat:"dev", access:"team", icon:"news", sheet:"", drive:"", url:"",
    en:{name:"Quarterly HSSE Bulletin",desc:"Current and past editions of the HSSE bulletin."},
    id:{name:"Buletin HSSE Triwulan",  desc:"Edisi terbaru dan sebelumnya dari buletin HSSE."} },
  { id:"security",  cat:"dev", access:"team", icon:"clock", sheet:"", drive:"", url:"",
    en:{name:"Security Timesheets",    desc:"Daily timesheet upload and print for security personnel."},
    id:{name:"Absensi Keamanan",       desc:"Unggah dan cetak absensi harian personel keamanan."} }
];

/* Tabs, in the order shown. "projects" shows everything. */
const TABS = ["projects","training","health","records","dev"];

/* =====================================================================
   2) Wording in both languages
   ===================================================================== */
const T = {
  en:{ heroTitle:"Every HSSE tool, in one place.",
       heroSub:"EcoOils Project, Sei Mangkei. Pick a tab, then open the tool you need.",
       search:"Search",
       open:"Open", sheet:"Sheet", sheetTip:"Open the Google Sheet", drive:"Drive", driveTip:"Open the Google Drive folder", soon:"Coming soon", tagOpen:"Open", tagTeam:"Team only",
       t_projects:"Projects", t_training:"Induction & Training", t_health:"Health", t_records:"Records", t_dev:"In development",
       n_projects:"All your tools. Live tools come first.",
       n_training:"Induction and training pages. These can be shared with contractors and crews.",
       n_health:"Crew health records. Team only.",
       n_records:"Trackers and registers. Team only.",
       n_dev:"Being built. Each card goes live when its link is added.",
       results:"Search results", none:"No tool matches your search.",
       dashTitle:"Live HSSE dashboard", dashDesc:"All your data in one view. Coming next.",
       footer:"EcoOils HSSE Hub. Team tools are for the HSSE team only. Do not share their links." },
  id:{ heroTitle:"Semua alat HSSE, dalam satu tempat.",
       heroSub:"Proyek EcoOils, Sei Mangkei. Pilih tab, lalu buka alat yang Anda perlukan.",
       search:"Cari",
       open:"Buka", sheet:"Sheet", sheetTip:"Buka Google Sheet", drive:"Drive", driveTip:"Buka folder Google Drive", soon:"Segera hadir", tagOpen:"Terbuka", tagTeam:"Khusus tim",
       t_projects:"Proyek", t_training:"Induksi & Pelatihan", t_health:"Kesehatan", t_records:"Catatan", t_dev:"Dalam pengembangan",
       n_projects:"Semua alat Anda. Alat yang sudah aktif ada di depan.",
       n_training:"Halaman induksi dan pelatihan. Boleh dibagikan ke kontraktor dan kru.",
       n_health:"Catatan kesehatan kru. Khusus tim.",
       n_records:"Pelacak dan daftar. Khusus tim.",
       n_dev:"Sedang dibangun. Setiap kartu aktif saat tautannya ditambahkan.",
       results:"Hasil pencarian", none:"Tidak ada alat yang cocok.",
       dashTitle:"Dasbor HSSE langsung", dashDesc:"Semua data Anda dalam satu tampilan. Segera menyusul.",
       footer:"EcoOils HSSE Hub. Alat tim hanya untuk tim HSSE. Jangan bagikan tautannya." }
};

/* =====================================================================
   3) Icons (inline, no downloads needed)
   ===================================================================== */
const S = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const svg = p => `<svg viewBox="0 0 24 24" ${S} aria-hidden="true">${p}</svg>`;
const ICONS = {
  shield:svg('<path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>'),
  book:svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M8 7h7M8 11h5"/>'),
  permit:svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/><path d="m14.5 17 1.2 1.2 2.3-2.4"/>'),
  alert:svg('<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v5M12 17.5v.5"/>'),
  chart:svg('<path d="M4 20V4M4 20h16"/><path d="m7 15 4-5 3 3 5-7"/>'),
  drop:svg('<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11Z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>'),
  heart:svg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/>'),
  pulse:svg('<path d="M3 12h4l2-5 4 10 2-5h6"/>'),
  news:svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h6v4H7zM15 8h2M15 12h2M7 16h10"/>'),
  clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  track:svg('<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>'),
  ims:svg('<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>'),
  db:svg('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
  medal:svg('<circle cx="12" cy="14" r="5"/><path d="m9 3 3 6 3-6M12 12v4"/>'),
  dash:svg('<rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/>'),
  sheet:svg('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>'),
  folder:svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>'),
  go:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>'
};

/* =====================================================================
   4) Rendering
   ===================================================================== */
let lang = "en", tab = "projects";
try { lang = localStorage.getItem("hubLang") || "en"; } catch(e){}
const h = location.hash.replace("#","");
if (TABS.includes(h)) tab = h;
else { try { const s = localStorage.getItem("hubTab"); if (TABS.includes(s)) tab = s; } catch(e){} }

const main = document.getElementById("main");
const tabsEl = document.getElementById("tabs");
const q = document.getElementById("q");

const inTab = (a, t) => t === "projects" || a.cat === t;

function card(a){
  const t = T[lang], c = a[lang], live = !!a.url;
  const tag = live ? `<span class="tag ${a.access}">${a.access==="open" ? t.tagOpen : t.tagTeam}</span>` : `<span class="tag soon">${t.soon}</span>`;
  const sheetBtn = a.sheet ? `<a class="btn alt" href="${a.sheet}" target="_blank" rel="noopener noreferrer" title="${t.sheetTip}" aria-label="${t.sheetTip}: ${c.name}">${ICONS.sheet}${t.sheet}</a>` : "";
  const driveBtn = a.drive ? `<a class="btn alt" href="${a.drive}" target="_blank" rel="noopener noreferrer" title="${t.driveTip}" aria-label="${t.driveTip}: ${c.name}">${ICONS.folder}${t.drive}</a>` : "";
  const btn = live
    ? `<div class="actions"><a class="btn" href="${a.url}" target="_blank" rel="noopener noreferrer">${t.open}${ICONS.go}</a>${sheetBtn}${driveBtn}</div>`
    : `<div class="actions"><a class="btn" aria-disabled="true" tabindex="-1">${t.soon}</a>${sheetBtn}${driveBtn}</div>`;
  return `<article class="card"><div class="card-top"><div class="icon">${ICONS[a.icon]}</div>${tag}</div><h3>${c.name}</h3><p>${c.desc}</p>${btn}</article>`;
}

function render(){
  const t = T[lang];
  const term = q.value.trim().toLowerCase();

  tabsEl.innerHTML = TABS.map(k => {
    const n = APPS.filter(a => inTab(a,k)).length;
    return `<button class="tab" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${!term && k===tab}" tabindex="${k===tab?0:-1}">${t["t_"+k]}<span class="n">${n}</span></button>`;
  }).join("");

  let html;
  if (term) {
    const hits = APPS.filter(a => (a[lang].name+" "+a[lang].desc).toLowerCase().includes(term));
    html = `<p class="note">${t.results}</p>` + (hits.length ? `<div class="grid">${hits.map(card).join("")}</div>` : `<p class="empty">${t.none}</p>`);
  } else {
    const list = APPS.filter(a => inTab(a, tab));
    html = `<p class="note">${t["n_"+tab]}</p><div class="grid">${list.map(card).join("")}</div>`;
    if (tab === "projects") html += `<section class="dash"><div class="icon">${ICONS.dash}</div><div><h3>${t.dashTitle}</h3><p>${t.dashDesc}</p></div></section>`;
  }
  main.innerHTML = html;
  main.setAttribute("aria-labelledby", "tab-" + tab);

  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t[el.dataset.i18nPh]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
}

function setTab(k){
  tab = k; q.value = "";
  try { localStorage.setItem("hubTab", k); } catch(e){}
  history.replaceState(null, "", "#" + k);
  render();
}

tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.tab); });
tabsEl.addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = TABS.indexOf(tab), n = (i + (e.key==="ArrowRight" ? 1 : TABS.length-1)) % TABS.length;
  setTab(TABS[n]); document.getElementById("tab-" + TABS[n]).focus();
});
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("hubLang", lang); } catch(e){}
  render();
}));
q.addEventListener("input", render);
render();
</script>
</body>
</html>
