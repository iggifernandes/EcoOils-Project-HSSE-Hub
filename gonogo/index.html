<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contractor Go/No-Go</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--ink:#1c2b21;--mut:#5d7064;--line:#dbe4dd;--g:#1f6b3a;--gl:#e3f3e8;--a:#b7791f;--al:#fdf1d8;--r:#b3261e;--rl:#fbe3e1;--n:#6b7f72;--nl:#eceff0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a14;--card:#17241c;--ink:#e6f0e9;--mut:#9fb3a5;--line:#2a3d31;--g:#5fc283;--gl:#173a25;--a:#e6b25a;--al:#3a2f14;--r:#f0877f;--rl:#3d1b19;--n:#9fb3a5;--nl:#202c25}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-left:46px;margin-bottom:12px}
h1{font-size:20px;margin:0}h1 small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--g);color:#fff;border-color:var(--g)}button:hover{filter:brightness(.97)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input[type=text],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
textarea{min-height:52px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.gate{border-radius:12px;padding:12px;border:2px solid var(--line)}
.gate b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.gate .v{font-size:24px;font-weight:800;margin:2px 0}
.gate.go{background:var(--gl);border-color:var(--g)}.gate.go .v{color:var(--g)}
.gate.cond{background:var(--al);border-color:var(--a)}.gate.cond .v{color:var(--a)}
.gate.no{background:var(--rl);border-color:var(--r)}.gate.no .v{color:var(--r)}
.gate small{color:var(--mut)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--nl);margin:8px 0 4px}
.bar i{display:block}.bar .i{background:var(--g)}.bar .m{background:var(--a)}.bar .l{background:var(--r)}.bar .x{background:var(--n);opacity:.55}
.leg{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.leg .i:before{background:var(--g)}.leg .m:before{background:var(--a)}.leg .l:before{background:var(--r)}.leg .x:before{background:var(--n);opacity:.55}.leg .u:before{background:var(--nl);border:1px solid var(--line)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:space-between;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--nl);color:var(--mut);white-space:nowrap}
.item{border-top:1px solid var(--line);padding:12px 14px;border-left:5px solid var(--line)}
.item.s-in{border-left-color:var(--g)}.item.s-mit{border-left-color:var(--a)}.item.s-late{border-left-color:var(--r)}.item.s-na{border-left-color:var(--n);opacity:.8}
.item h4{margin:0 0 2px;font-size:15px}.item .sr{color:var(--mut);font-weight:600;margin-right:6px}
.item .req{font-size:12px;color:var(--mut)}
.ev{font-size:13px;color:var(--mut);white-space:pre-wrap;margin:6px 0;background:var(--nl);border-radius:8px;padding:6px 8px}
.ev summary{cursor:pointer;font-weight:600;color:var(--ink)}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.toolbar button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.note{font-size:12px;color:var(--mut)}
.ver{margin:24px auto 12px;text-align:center;font-size:12px;color:var(--mut)}
.eco-home{position:fixed;top:10px;left:10px;z-index:9999;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#1f6b3a;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);text-decoration:none}
.eco-home:hover{background:#17542d}
.pr-only{display:none}
@media print{
 body{background:#fff;color:#000}.eco-home,.toolbar,.noprint,button{display:none!important}
 details.sec{break-inside:auto}details.sec>*{display:block}.item{break-inside:avoid}.card,.gate{border-color:#999}
 .pr-only{display:block}input,select,textarea{border:none;padding:0}
}
</style>
</head>

<div class="toolbar noprint" id="tb"></div>

<div class="card">

  <div><label class="f" id="lCtSign"></label><div class="row"><input type="text" id="sCtN" style="flex:2;min-width:120px"><input type="date" id="sCtD" style="flex:1;min-width:130px"></div></div>
 </div>
 <p class="note" id="derog" style="margin-bottom:0"></p>
</div>

<div class="card noprint">
 <div class="row">
  <button class="p" id="bPrint" type="button"></button><button id="bCsv" type="button"></button><button id="bBack" type="button"></button><button id="bRest" type="button"></button>
 </div>
 <p class="note" id="stor" style="margin-bottom:0"></p>
 <input type="file" id="fRest" accept="application/json" hidden>
</div>
</div>

 rule:"Rule: a gate is GO when every item due by that gate is In place or Not applicable. It is GO WITH MITIGATION when the open items all have a mitigation identified. It is NO-GO if any item needs more time or has not been assessed. Gate 2 includes Gate 1 items; Gate 3 includes all items.",
 lgI:"In place",lgM:"Mitigation identified",lgL:"Needs more time",lgU:"Not assessed",lgX:"Not applicable",
 all:"All",fOpen:"Open only",fMob:"Prior to mob",expand:"Expand all",collapse:"Collapse all",
 hSign:"Final sign-off",signCo:"Signed by COMPANY Contract Holder",signCt:"Signed by CONTRACTOR Manager",
 derog:"** Derogations against high-risk requirements such as road transport must be approved by the Company contract holder and recorded in the comments.",
 print:"Print / save as PDF",csv:"Export CSV (Excel)",back:"Back up (JSON)",rest:"Restore backup",
 stor:"Saved in this browser only until the Google Sheet link is added. Use Back up regularly. Section titles: the checklist text is in English as in the Company template.",
 sec:"Section",items:"items",open:"open",confirmDel:"Delete this contractor and all its answers?",newName:"New contractor",
 ok:"Backup restored.",bad:"That file could not be read.",nobody:"(not set)"},
id:{ttl:"Go / No-Go Kontraktor",sub:"Daftar periksa mobilisasi dan kesiapan mulai",con:"Kontraktor",add:"Tambah kontraktor",del:"Hapus kontraktor",name:"Nama kontraktor",contract:"Kontrak",holder:"Pemegang kontrak Perusahaan",
 phMob:"Sebelum mobilisasi",phStart:"Sebelum start-up",phAfter:"Setelah start-up",phase:"Kapan diperlukan",
 a_:"Belum dinilai",a_in:"Sudah ada",a_mit:"Belum ada, mitigasi ditetapkan",a_late:"Belum ada, butuh waktu",a_na:"Tidak berlaku",
 assess:"Penilaian audit (Perusahaan)",cm:"Komentar / mitigasi (mis. lingkup dikurangi, pengawasan ditambah atau derogasi**)",ev:"Bukti yang harus diserahkan atau diverifikasi",link:"Tautan bukti (Drive)",
 ctSign:"Persetujuan Kontraktor (nama, tanggal)",coSign:"Persetujuan Perusahaan (nama, tanggal)",
 gMob:"Gerbang 1 · Mobilisasi",gStart:"Gerbang 2 · Start-up",gAll:"Gerbang 3 · Setelah start-up",
 GO:"GO",COND:"GO DENGAN MITIGASI",NO:"NO-GO",
 gDet:(a,b,c,d)=>a+" sudah ada · "+b+" dimitigasi · "+c+" butuh waktu · "+d+" belum dinilai",
 rule:"Aturan: gerbang berstatus GO bila semua butir yang jatuh tempo sudah Ada atau Tidak berlaku. GO DENGAN MITIGASI bila butir terbuka semuanya sudah punya mitigasi. NO-GO bila ada butir yang butuh waktu atau belum dinilai. Gerbang 2 mencakup butir Gerbang 1; Gerbang 3 mencakup semua butir.",
 lgI:"Sudah ada",lgM:"Mitigasi ditetapkan",lgL:"Butuh waktu",lgU:"Belum dinilai",lgX:"Tidak berlaku",
 all:"Semua",fOpen:"Hanya terbuka",fMob:"Sebelum mob",expand:"Buka semua",collapse:"Tutup semua",
 hSign:"Persetujuan akhir",signCo:"Ditandatangani Pemegang Kontrak PERUSAHAAN",signCt:"Ditandatangani Manajer KONTRAKTOR",
 derog:"** Derogasi atas persyaratan berisiko tinggi seperti transportasi jalan harus disetujui pemegang kontrak Perusahaan dan dicatat di komentar.",
 print:"Cetak / simpan PDF",csv:"Ekspor CSV (Excel)",back:"Cadangkan (JSON)",rest:"Pulihkan cadangan",
 stor:"Tersimpan hanya di peramban ini sampai tautan Google Sheet ditambahkan. Cadangkan secara berkala. Teks daftar periksa tetap berbahasa Inggris sesuai templat Perusahaan.",
 sec:"Bagian",items:"butir",open:"terbuka",confirmDel:"Hapus kontraktor ini beserta semua jawabannya?",newName:"Kontraktor baru",
 ok:"Cadangan dipulihkan.",bad:"Berkas tidak dapat dibaca.",nobody:"(belum diisi)"}};
const PH=["mob","start","after"], PHK={mob:"phMob",start:"phStart",after:"phAfter"};
const AS=["","in","mit","late","na"];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang="en";try{lang=localStorage.getItem("gngLang")||"en"}catch(e){}
const L=()=>I18[lang];
let st;
function blank(name){return{id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name||"",contract:"",holder:"",items:{},coN:"",coD:"",ctN:"",ctD:""}}
function seedPBS(){const c=blank("PT Paramita Bangun Sarana Tbk (PBS)");c.holder="Darren Lim";
 for(const k in DATA.seed){const s=DATA.seed[k];c.items[k]={a:s.a,ph:s.phase||"",cn:s.cn,cd:s.cd,pn:s.pn,pd:s.pd,cm:s.cm,link:""};}
 return c}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.list&&s.list.length)return s}catch(e){}
 const l=[seedPBS(),blank("GSB"),blank("WEN"),blank("KKS")];return{cur:l[0].id,list:l}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
st=load();
const cur=()=>st.list.find(c=>c.id===st.cur)||st.list[0];
function it(c,id){return c.items[id]||(c.items[id]={a:"",ph:"",cn:"",cd:"",pn:"",pd:"",cm:"",link:""})}
const phaseOf=(c,i)=>{const o=c.items[i.id];return(o&&o.ph)||i.phase};
const ALL=[];DATA.sections.forEach(s=>s.items.forEach(i=>ALL.push(i)));

function gateCalc(c,upTo){
 const idx=PH.indexOf(upTo);let n={in:0,mit:0,late:0,u:0,na:0,tot:0};
 ALL.forEach(i=>{if(PH.indexOf(phaseOf(c,i))>idx)return;const a=(c.items[i.id]||{}).a||"";
  if(a==="na")n.na++;else{n.tot++;if(a==="in")n.in++;else if(a==="mit")n.mit++;else if(a==="late")n.late++;else n.u++;}});
 const v=(n.late||n.u)?"no":n.mit?"cond":"go";return{n,v}}
function renderSummary(){
 const c=cur(),t=L();
 $("gates").innerHTML=[["mob","gMob"],["start","gStart"],["after","gAll"]].map(([p,k])=>{
  const g=gateCalc(c,p),n=g.n;
  return `<div class="gate ${g.v}"><b>${esc(t[k])}</b><div class="v">${g.v==="go"?t.GO:g.v==="cond"?t.COND:t.NO}</div><small>${esc(t.gDet(n.in,n.mit,n.late,n.u))}</small></div>`}).join("");
 const a=gateCalc(c,"after").n,all=ALL.length||1;
 const w=x=>(x/all*100).toFixed(1)+"%";
 $("bar").innerHTML=`<i class="i" style="width:${w(a.in)}"></i><i class="m" style="width:${w(a.mit)}"></i><i class="l" style="width:${w(a.late)}"></i><i class="x" style="width:${w(a.na)}"></i>`;
 document.querySelectorAll("details.sec").forEach(d=>{
  const sec=DATA.sections[+d.dataset.i];let open=0;
  sec.items.forEach(i=>{const x=(c.items[i.id]||{}).a||"";if(x!=="in"&&x!=="na")open++});
  const e=d.querySelector(".chip");if(e)e.textContent=sec.items.length+" "+t.items+" · "+open+" "+t.open});
}
function itemHTML(c,i){
 const t=L(),o=c.items[i.id]||{a:"",ph:"",cn:"",cd:"",pn:"",pd:"",cm:"",link:""},ph=o.ph||i.phase;
 const opt=(arr,sel,f)=>arr.map(v=>`<option value="${v}"${v===sel?" selected":""}>${esc(f(v))}</option>`).join("");
 return `<div class="item s-${o.a||"u"}" data-id="${i.id}">
 <h4>${i.sr?`<span class="sr">${esc(i.sr)}</span>`:""}${esc(i.act)}</h4>
 ${i.req&&i.req!==i.act?`<div class="req">${esc(i.req)}</div>`:""}
 ${i.ev?`<details class="ev"><summary>${esc(t.ev)}</summary>${esc(i.ev)}</details>`:""}
 <div class="ig">
  <div><label class="f">${esc(t.assess)}</label><select data-f="a">${opt(AS,o.a,v=>t["a_"+v])}</select></div>
  <div><label class="f">${esc(t.phase)}</label><select data-f="ph">${opt(PH,ph,v=>t[PHK[v]])}</select></div>
  <div><label class="f">${esc(t.ctSign)}</label><div class="row"><input type="text" data-f="cn" value="${esc(o.cn)}" style="flex:2;min-width:90px"><input type="date" data-f="cd" value="${esc(o.cd)}" style="flex:1;min-width:120px"></div></div>
  <div><label class="f">${esc(t.coSign)}</label><div class="row"><input type="text" data-f="pn" value="${esc(o.pn)}" style="flex:2;min-width:90px"><input type="date" data-f="pd" value="${esc(o.pd)}" style="flex:1;min-width:120px"></div></div>
 </div>
 <div class="ig" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
  <div><label class="f">${esc(t.cm)}</label><textarea data-f="cm">${esc(o.cm)}</textarea></div>
  <div><label class="f">${esc(t.link)}</label><input type="url" data-f="link" value="${esc(o.link)}" placeholder="https://drive.google.com/…"></div>
 </div></div>`}
let flt="all";
function renderSecs(){
 const c=cur(),t=L();
 const openIds=new Set([...document.querySelectorAll("details.sec[open]")].map(d=>d.dataset.i));
 $("secs").innerHTML=DATA.sections.map((s,n)=>{
  const items=s.items.filter(i=>{const o=c.items[i.id]||{},a=o.a||"";
   if(flt==="open")return a!=="in"&&a!=="na";if(flt==="mob")return phaseOf(c,i)==="mob"&&a!=="na";return true});
  if(!items.length)return"";
  return `<details class="sec" data-i="${n}"${openIds.has(String(n))?" open":""}><summary><span>${esc(s.no)}. ${esc(s.name)}</span><span class="chip"></span></summary>${items.map(i=>itemHTML(c,i)).join("")}</details>`}).join("");
 renderSummary()}
function renderStatic(){
 const t=L();document.documentElement.lang=lang;
 $("ttl").innerHTML=esc(t.ttl)+"<small>"+esc(t.sub)+"</small>";document.title=t.ttl;
 $("lang").textContent=lang==="en"?"ID":"EN";
 $("lCon").textContent=t.con;$("addCon").textContent=t.add;$("delCon").textContent=t.del;
 $("lName").textContent=t.name;$("lContract").textContent=t.contract;$("lHolder").textContent=t.holder;
 $("lgI").textContent=t.lgI;$("lgM").textContent=t.lgM;$("lgL").textContent=t.lgL;$("lgU").textContent=t.lgU;$("lgX").textContent=t.lgX;
 $("rule").textContent=t.rule;$("hSign").textContent=t.hSign;$("lCoSign").textContent=t.signCo;$("lCtSign").textContent=t.signCt;$("derog").textContent=t.derog;
 $("bPrint").textContent=t.print;$("bCsv").textContent=t.csv;$("bBack").textContent=t.back;$("bRest").textContent=t.rest;$("stor").textContent=t.stor;
 $("tb").innerHTML=[["all",t.all],["open",t.fOpen],["mob",t.fMob]].map(([k,l])=>`<button type="button" data-flt="${k}" aria-pressed="${flt===k}">${esc(l)}</button>`).join("")+`<button type="button" data-x="1">${esc(t.expand)}</button><button type="button" data-x="0">${esc(t.collapse)}</button>`;
 $("conSel").innerHTML=st.list.map(c=>`<option value="${c.id}"${c.id===st.cur?" selected":""}>${esc(c.name||t.nobody)}</option>`).join("")}
function renderHead(){const c=cur();$("cName").value=c.name;$("cContract").value=c.contract;$("cHolder").value=c.holder;
 $("sCoN").value=c.coN;$("sCoD").value=c.coD;$("sCtN").value=c.ctN;$("sCtD").value=c.ctD}
function renderAll(){renderStatic();renderHead();renderSecs()}

$("lang").onclick=()=>{lang=lang==="en"?"id":"en";try{localStorage.setItem("gngLang",lang)}catch(e){}renderAll()};
$("conSel").onchange=e=>{st.cur=e.target.value;save();renderAll()};
$("addCon").onclick=()=>{const c=blank(L().newName);st.list.push(c);st.cur=c.id;save();renderAll();$("cName").focus();$("cName").select()};
$("delCon").onclick=()=>{if(st.list.length<2){return}if(!confirm(L().confirmDel))return;st.list=st.list.filter(c=>c.id!==st.cur);st.cur=st.list[0].id;save();renderAll()};
[["cName","name"],["cContract","contract"],["cHolder","holder"],["sCoN","coN"],["sCoD","coD"],["sCtN","ctN"],["sCtD","ctD"]].forEach(([id,k])=>$(id).addEventListener("input",e=>{cur()[k]=e.target.value;save();if(k==="name"){const o=$("conSel").selectedOptions[0];if(o)o.textContent=e.target.value||L().nobody}}));
$("secs").addEventListener("input",e=>{const f=e.target.dataset.f,row=e.target.closest(".item");if(!f||!row)return;
 const o=it(cur(),row.dataset.id);o[f]=e.target.value;save();
 if(f==="a"){row.className="item s-"+(o.a||"u")}
 if(f==="a"||f==="ph")renderSummary()});
$("tb").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.flt){flt=b.dataset.flt;renderStatic();renderSecs()}
 else if(b.dataset.x){document.querySelectorAll("details.sec").forEach(d=>d.open=b.dataset.x==="1")}});
$("bPrint").onclick=()=>{document.querySelectorAll("details.sec").forEach(d=>d.open=true);window.print()};
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const safeName=()=>(cur().name||"contractor").replace(/[^\w]+/g,"_").slice(0,40);
$("bCsv").onclick=()=>{const c=cur(),t=I18.en;
 const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
 const rows=[["Go / No-Go Criteria - Mobilization and Readiness to Start Checklist"],["CONTRACTOR NAME:",c.name],["CONTRACT:",c.contract],["CONTRACT HOLDER:",c.holder],[],
  ["Sr#","Requirement","Specific Action","Phase","Contractor sign off name","Date","Company sign off name","Date","Audit assessment","Comments / mitigation","Evidence required","Evidence link"]];
 DATA.sections.forEach(s=>{rows.push([s.no,s.name]);s.items.forEach(i=>{const o=c.items[i.id]||{};
  rows.push([i.sr,i.req,i.act,t[PHK[phaseOf(c,i)]],o.cn,o.cd,o.pn,o.pd,t["a_"+(o.a||"")],o.cm,i.ev,o.link])})});
 rows.push([]);["mob","start","after"].forEach((p,k)=>rows.push([["Gate 1 Mobilization","Gate 2 Start-up","Gate 3 After start-up"][k],{go:"GO",cond:"GO WITH MITIGATION",no:"NO-GO"}[gateCalc(c,p).v]]));
 rows.push(["Signed by COMPANY Contract Holder",c.coN,c.coD],["Signed by CONTRACTOR Manager",c.ctN,c.ctD]);
 dl("GoNoGo_"+safeName()+".csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv")};
$("bBack").onclick=()=>dl("GoNoGo_backup_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(st),"application/json");
$("bRest").onclick=()=>$("fRest").click();
$("fRest").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.list||!s.list.length)throw 0;st=s;if(!st.list.some(c=>c.id===st.cur))st.cur=st.list[0].id;save();renderAll();alert(L().ok)}catch(x){alert(L().bad)}};r.readAsText(f);e.target.value=""};
renderAll();
</script>
</body>
</html>
